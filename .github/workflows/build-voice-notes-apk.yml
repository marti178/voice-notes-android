
name: Build Voice Notes APK

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/build-voice-notes-apk.yml'
      - 'examples/whisper.android/**'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'include/**'
      - 'ggml/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-voice-notes-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Android project and native sources
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="examples/whisper.android"

          test -f "$PROJECT/gradlew"
          test -f "$PROJECT/settings.gradle"
          test -f "$PROJECT/build.gradle"
          test -f "$PROJECT/app/build.gradle"
          test -f "$PROJECT/lib/build.gradle"

          test -f "$PROJECT/gradle/wrapper/gradle-wrapper.properties"
          test -f "$PROJECT/lib/src/main/jni/whisper/CMakeLists.txt"
          test -f "CMakeLists.txt"
          test -f "src/whisper.cpp"
          test -d "ggml"

          echo "Proyecto Android y fuentes nativas encontrados."
          echo "Configuración Gradle:"
          cat "$PROJECT/gradle/wrapper/gradle-wrapper.properties"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            examples/whisper.android/gradle/wrapper/gradle-wrapper.properties
            examples/whisper.android/**/*.gradle
            examples/whisper.android/**/*.gradle.kts

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKM="$(find "$SDK/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -n "$SDKM"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKM")" >> "$GITHUB_PATH"
          echo "SDK: $SDK / sdkmanager: $SDKM"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

          echo "Versiones instaladas:"
          java -version
          sdkmanager --list_installed

      - name: Prepare Gradle wrapper
        working-directory: examples/whisper.android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --version

      - name: Install model download utility
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade gdown

      - name: Download and verify AI models
        shell: bash
        env:
          MODEL_FOLDER_URL: https://drive.google.com/drive/folders/1dO2Wqe6b-FBWRtLeiktaCbH-PBy-wca0?usp=sharing
        run: |
          set -euo pipefail

          DOWNLOAD_DIR="$RUNNER_TEMP/voice-notes-models"
          ASSETS_DIR="examples/whisper.android/app/src/main/assets/models"

          mkdir -p "$DOWNLOAD_DIR" "$ASSETS_DIR"

          echo "Descargando modelos desde Google Drive..."
          gdown --folder "$MODEL_FOLDER_URL" -O "$DOWNLOAD_DIR"

          echo "Archivos descargados:"
          find "$DOWNLOAD_DIR" -type f -printf '%p (%s bytes)\n'

          for model in \
            gemma3-1b-it-int4.task \
            embedding_model.onnx \
            ggml-tiny-q8_0.bin
          do
            found="$(find "$DOWNLOAD_DIR" -type f -name "$model" -print -quit)"

            if [ -z "$found" ]; then
              echo "::error::No se encontró el modelo requerido: $model"
              exit 1
            fi

            if [ ! -s "$found" ]; then
              echo "::error::El modelo está vacío: $model"
              exit 1
            fi

            size="$(stat -c '%s' "$found")"
            if [ "$size" -lt 1048576 ]; then
              echo "::error::El archivo $model mide menos de 1 MiB; puede ser una descarga incorrecta."
              exit 1
            fi

            cp "$found" "$ASSETS_DIR/$model"
            echo "Modelo verificado: $model ($size bytes)"
          done

          echo "Contenido final de assets/models:"
          ls -lh "$ASSETS_DIR"
          du -sh "$ASSETS_DIR"

      - name: Build debug APK
        working-directory: examples/whisper.android
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug

      - name: Verify generated APK
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="examples/whisper.android/app/build/outputs/apk/debug"
          APK="$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::Gradle terminó sin generar un APK."
            find examples/whisper.android/app/build/outputs -maxdepth 5 -type f || true
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "::error::El APK generado está vacío."
            exit 1
          fi

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK generado correctamente:"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-notes-debug-apk
          path: ${{ steps.verify_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: voice-notes-build-diagnostics
          path: |
            examples/whisper.android/**/build/reports/**
            examples/whisper.android/**/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
