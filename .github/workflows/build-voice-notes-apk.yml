name: Build Voice Notes APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download AI models
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade gdown

          mkdir -p /tmp/voice-notes-models
          mkdir -p examples/whisper.android/app/src/main/assets/models

          gdown --folder \
            'https://drive.google.com/drive/folders/1dO2Wqe6b-FBWRtLeiktaCbH-PBy-wca0' \
            -O /tmp/voice-notes-models

          echo "Downloaded files:"
          find /tmp/voice-notes-models -type f

          for model in \
            gemma3-1b-it-int4.task \
            embedding_model.onnx \
            ggml-tiny-q8_0.bin
          do
            found="$(find /tmp/voice-notes-models -type f -name "$model" -print -quit)"

            if [ -z "$found" ]; then
              echo "::error::Model not found: $model"
              exit 1
            fi

            cp "$found" examples/whisper.android/app/src/main/assets/models/
            echo "Copied model: $model"
          done

      - name: Build debug APK
        working-directory: examples/whisper.android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-notes-debug-apk
          path: examples/whisper.android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
