name: Build Voice Notes APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download AI models from the project's public Google Drive folder
        run: |
          python -m pip install --upgrade pip gdown
          mkdir -p examples/whisper.android/app/src/main/assets/models
          gdown --folder 'https://drive.google.com/drive/folders/1dO2Wqe6b-FBWRtLeiktaCbH-PBy-wca0?usp=sharing' -O /tmp/voice-notes-models
          find /tmp/voice-notes-models -type f -maxdepth 3 -print
          for model in gemma3-1b-it-int4.task embedding_model.onnx ggml-tiny-q8_0.bin; do
            found="$(find /tmp/voice-notes-models -type f -name "$model" -print -quit)"
            if [ -z "$found" ]; then
              echo "ERROR: Model not found in Google Drive: $model"
              exit 1
            fi
            cp "$found" examples/whisper.android/app/src/main/assets/models/
          done

      - name: Build debug APK
        working-directory: examples/whisper.android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-notes-debug-apk
          path: examples/whisper.android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
