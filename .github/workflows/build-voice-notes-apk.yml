name: Build Voice Notes APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/build-voice-notes-apk.yml'
      - 'examples/whisper.android/**'

permissions:
  contents: read

concurrency:
  group: build-voice-notes-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="examples/whisper.android"

          if [ ! -f "$PROJECT/gradlew" ]; then
            echo "::error::No se encontró $PROJECT/gradlew"
            exit 1
          fi

          if [ ! -f "$PROJECT/settings.gradle" ] &&
             [ ! -f "$PROJECT/settings.gradle.kts" ]; then
            echo "::error::No se encontró el archivo settings de Gradle"
            exit 1
          fi

          if [ ! -f "$PROJECT/app/build.gradle" ] &&
             [ ! -f "$PROJECT/app/build.gradle.kts" ]; then
            echo "::error::No se encontró la configuración de la aplicación Android"
            exit 1
          fi

          echo "Proyecto Android verificado."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: examples/whisper.android/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false

      - name: Check Gradle wrapper
        working-directory: examples/whisper.android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          java -version
          ./gradlew --version

      - name: Install model download utility
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade gdown

      - name: Download AI models
        shell: bash
        env:
          MODEL_FOLDER_URL: https://drive.google.com/drive/folders/1dO2Wqe6b-FBWRtLeiktaCbH-PBy-wca0
        run: |
          set -euo pipefail

          DOWNLOAD_DIR="$RUNNER_TEMP/voice-notes-models"
          ASSETS_DIR="examples/whisper.android/app/src/main/assets/models"

          mkdir -p "$DOWNLOAD_DIR" "$ASSETS_DIR"

          gdown --folder "$MODEL_FOLDER_URL" -O "$DOWNLOAD_DIR"

          echo "Archivos descargados:"
          find "$DOWNLOAD_DIR" -type f -printf '%p (%s bytes)\n'

          for model in \
            gemma3-1b-it-int4.task \
            embedding_model.onnx \
            ggml-tiny-q8_0.bin
          do
            found="$(find "$DOWNLOAD_DIR" -type f -name "$model" -print -quit)"

            if [ -z "$found" ]; then
              echo "::error::No se encontró el modelo requerido: $model"
              exit 1
            fi

            if [ ! -s "$found" ]; then
              echo "::error::El modelo está vacío: $model"
              exit 1
            fi

            cp "$found" "$ASSETS_DIR/$model"
            echo "Modelo preparado: $model"
          done

          echo "Tamaño total de los modelos:"
          du -sh "$ASSETS_DIR"

      - name: Build debug APK
        working-directory: examples/whisper.android
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug

      - name: Verify APK
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="examples/whisper.android/app/build/outputs/apk/debug"
          mkdir -p "$APK_DIR"

          APK="$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::La compilación terminó sin generar un APK."
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "::error::El APK generado está vacío."
            exit 1
          fi

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK generado correctamente:"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-notes-debug-apk
          path: ${{ steps.verify_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: voice-notes-build-diagnostics
          path: |
            examples/whisper.android/**/build/reports/**
            examples/whisper.android/**/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
