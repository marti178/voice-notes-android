
name: Examples WASM

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-wasm-github-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14

      - name: Build WASM Examples
        run: |
          set -e
          mkdir -p build-em
          cd build-em
          emcmake cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --parallel 2

      - name: Create staging directory
        run: |
          mkdir -p staging
          touch staging/.nojekyll

      - name: Copy application files
        shell: bash
        run: |
          set -e
          build_dir="build-em/bin"

          if [ ! -d "$build_dir" ]; then
            echo "::error::No existe el directorio $build_dir"
            echo "Contenido de build-em:"
            find build-em -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Archivos compilados:"
          find "$build_dir" -maxdepth 4 -type f | sort

          # command.wasm
          target_dir="staging/command.wasm"
          mkdir -p "$target_dir"
          cp "$build_dir"/command.wasm/{index.html,command.js,helpers.js} "$target_dir/"
          cp "$build_dir/libcommand.js" "$target_dir/"

          # bench.wasm
          target_dir="staging/bench.wasm"
          mkdir -p "$target_dir"
          cp "$build_dir"/bench.wasm/{index.html,bench.js,helpers.js} "$target_dir/"
          cp "$build_dir/libbench.js" "$target_dir/"

          # stream.wasm
          target_dir="staging/stream.wasm"
          mkdir -p "$target_dir"
          cp "$build_dir"/stream.wasm/{index.html,stream.js,helpers.js} "$target_dir/"
          cp "$build_dir/libstream.js" "$target_dir/"

          # wchess.wasm
          target_dir="staging/wchess.wasm"
          mkdir -p "$target_dir"
          cp -r "$build_dir"/wchess.wasm/{index.html,css,img,js} "$target_dir/"
          cp "$build_dir/wchess.wasm.js" "$target_dir/"

          # whisper.wasm
          cp "$build_dir"/whisper.wasm/{index.html,main.js,helpers.js} staging/
          cp "$build_dir/libmain.js" staging/

          # Cross-Origin Isolation service worker
          cp examples/coi-serviceworker.js staging/

      - name: List files in staging directory
        run: |
          echo "Archivos que se publicarán:"
          find staging -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./staging

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
